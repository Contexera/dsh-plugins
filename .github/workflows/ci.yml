# CI gate for every package in the monorepo, on clean Linux and Windows runners.
#
# Self-contained on purpose. Every package depends on PUBLISHED @deepseek-ai
# packages, so a clean checkout has nothing to clone and no sibling directory to
# resolve. The windows lane is the regression fence for path, identifier and
# file-name handling on a real Windows filesystem.
name: ci

on:
  pull_request:
  push:
    branches: [master]
    # Docs-only pushes skip the gate: Markdown never reaches code. The pack gate
    # below still guards documentation packaging on every PR and on any push
    # that does touch code, and `pnpm release` re-runs it before publishing.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Least privilege: the jobs only read this repository.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not a per-package script: the DSH peer contract spans packages (declared
      # line = peer lower bound = the exact version pinned for the tests).
      - run: pnpm check:peers
      - run: pnpm check:comments
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      # After build on purpose: this gate packs each package as `npm publish`
      # would, so it reads the real `lib/` tree and the manifest's `files` list,
      # and fails when a README links a document the tarball does not carry.
      - run: pnpm check:pack

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:peers
      - run: pnpm check:comments
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm check:pack
